# ============================================
# Azure Portfolio — CI/CD Pipeline
# Triggers on push to main branch
# Deploys to Azure Static Web Apps via Bicep
# ============================================

name: Deploy to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ── Job 1: Validate ─────────────────────
  # Runs on every PR and push
  # Catches errors before they hit production
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ secrets.AZURE_RG }} \
            --template-file infra/main.bicep \
            --parameters infra/main.prod.bicepparam

  # ── Job 2: Deploy Infra ──────────────────
  # Only runs when code lands on main
  # Provisions Azure resources via Bicep
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      swa-name: ${{ steps.deploy.outputs.swaName }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep
        run: az bicep install

      - name: Deploy Bicep template
        id: deploy
        run: |
          output=$(az deployment group create \
            --resource-group ${{ secrets.AZURE_RG }} \
            --template-file infra/main.bicep \
            --parameters infra/main.prod.bicepparam \
            --query properties.outputs \
            --output json)

          echo "swaName=$(echo $output | jq -r '.swaName.value')" >> $GITHUB_OUTPUT
          echo "swaUrl=$(echo $output | jq -r '.swaUrl.value')" >> $GITHUB_OUTPUT

      - name: Print deployment URL
        run: |
          echo "Deployed to: https://${{ steps.deploy.outputs.swaUrl }}"

  # ── Job 3: Deploy Site ───────────────────
  # Deploys the actual HTML to Static Web App
  deploy-site:
    name: Deploy Site
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get SWA deployment token
        id: swa-token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ needs.deploy-infra.outputs.swa-name }} \
            --query properties.apiKey \
            --output tsv)
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src
          output_location: src